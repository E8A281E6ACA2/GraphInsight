name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      run_release_acceptance:
        description: Run the full release acceptance chain through the unified Linux entrypoint.
        required: false
        default: false
        type: boolean
      run_frontend_e2e:
        description: Run the full frontend DocQA E2E flow against an externally reachable Go gateway.
        required: false
        default: false
        type: boolean
      frontend_e2e_spec:
        description: Playwright spec to run when frontend E2E is enabled.
        required: false
        default: business-docqa-flow.spec.ts
        type: string
      run_perf_probe:
        description: Run performance probe against an externally reachable Go gateway.
        required: false
        default: false
        type: boolean
      run_perf_soak:
        description: Run repeated soak/capacity probe rounds against an externally reachable Go gateway.
        required: false
        default: false
        type: boolean
      perf_probe_preset:
        description: Performance probe preset.
        required: false
        default: release
        type: choice
        options:
          - readonly
          - release
      perf_probe_requests:
        description: Request count per perf probe case.
        required: false
        default: '20'
        type: string
      perf_probe_concurrency:
        description: Perf probe concurrency.
        required: false
        default: '4'
        type: string
      perf_soak_rounds:
        description: Number of soak rounds to execute.
        required: false
        default: '3'
        type: string
      perf_soak_sleep_seconds:
        description: Pause between soak rounds.
        required: false
        default: '5'
        type: string
      run_backend_release_smoke:
        description: Run the full 20-case backend release smoke suite against an externally reachable Go gateway.
        required: false
        default: false
        type: boolean
      backend_release_smoke_include:
        description: Optional backend smoke case filter. Repeat behavior is comma-separated in CI.
        required: false
        default: ''
        type: string
      run_rollback_matrix:
        description: Run the enforce + soft rollback acceptance matrix over the candidate versions.
        required: false
        default: false
        type: boolean
      rollback_matrix_versions:
        description: Comma-separated versions for the rollback matrix. Every version runs in both authz modes.
        required: false
        default: 'HEAD,78b1f28'
        type: string

jobs:
  go-backend:
    name: Go backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go-backend/go.sum

      - name: Test
        run: go test ./...

  backend-scripts:
    name: Backend smoke script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile smoke and perf scripts
        run: |
          python -m py_compile \
            backend/tests/issue_admin_token.py \
            backend/tests/run_unified_boundary_guards.py \
            backend/tests/run_backend_smoke_suite.py \
            backend/tests/run_perf_probe.py \
            backend/tests/run_perf_soak.py \
            backend/tests/check_artifact_secrets.py \
            backend/tests/check_artifact_secrets_selftest.py \
            backend/tests/check_rbac_catalog_parity.py \
            backend/tests/check_workflow_contexts.py \
            backend/tests/run_rollback_drill.py \
            go-backend/scripts/smoke_orchestrated_routes.py
          bash -n backend/tests/run_release_acceptance.sh frontend/tests/run_admin_e2e.sh \
            backend/tests/run_rollback_matrix.sh backend/tests/run_rollback_leg.sh

      - name: Check workflow expression contexts
        run: |
          # Actions 只在 push 之后才报 "workflow is not valid"，而且这个 run 没有日志、
          # 没有 job、没有 check-run。位置非法的 context（如 job 级 env 用 runner.temp）
          # 必须在合并前静态判掉。
          python -m pip install --quiet pyyaml
          python backend/tests/check_workflow_contexts.py --path .github/workflows

      - name: Verify credential-scan fails closed on missing required secret
        shell: bash
        run: |
          # CI 负向探针（任务 #207 / #209）：门禁最怕的失效形态是"退化成永久绿灯"，
          # 而"只判非零退出"又会把普通崩溃/参数错误误记成 FAILCLOSED_OK。故这里捕获
          # 退出码与输出，对三条契约做精确断言，任一不符（码或字段）即让 job 失败：
          #   CASE1 纯空白受保护变量 → 必须等同未设：exit 2 + reason=protected_credential_unset
          #          + artifacts_withheld=true（守护 strip-before-presence 修复）；
          #   CASE2 已设且产物含其字面值 → 必须 exit 1 + kind=run_credential；
          #   CASE3 已设且产物干净 → 必须 exit 0 + findings=0 + result=pass。
          set -uo pipefail
          scanner=backend/tests/check_artifact_secrets.py
          probe_dir="$(mktemp -d)"
          probe_secret="ci-probe-$(python -c 'import secrets; print(secrets.token_hex(8))')"
          rc=0

          printf 'health check ok, nothing sensitive\n' > "$probe_dir/clean.log"
          out="$(GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE='   ' \
            python "$scanner" --path "$probe_dir/clean.log" \
              --require-secret-env-var GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE 2>&1)"; code=$?
          if [ "$code" -eq 2 ] \
            && printf '%s' "$out" | grep -q 'reason=protected_credential_unset' \
            && printf '%s' "$out" | grep -q 'artifacts_withheld=true'; then
            echo "FAILCLOSED_OK whitespace_required_secret_fails_closed_exit2"
          else
            echo "::error::CASE1 expected exit 2 + protected_credential_unset + artifacts_withheld=true, got exit=$code"
            printf '%s\n' "$out"; rc=1
          fi

          printf 'payload %s end\n' "$probe_secret" > "$probe_dir/hit.log"
          out="$(GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE="$probe_secret" \
            python "$scanner" --path "$probe_dir/hit.log" \
              --require-secret-env-var GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE 2>&1)"; code=$?
          if [ "$code" -eq 1 ] && printf '%s' "$out" | grep -q 'kind=run_credential'; then
            echo "PROTECTED_LITERAL_OK required_secret_literal_detected_exit1"
          else
            echo "::error::CASE2 expected exit 1 + kind=run_credential, got exit=$code"
            printf '%s\n' "$out"; rc=1
          fi

          printf 'health check ok, nothing sensitive\n' > "$probe_dir/absent.log"
          out="$(GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE="$probe_secret" \
            python "$scanner" --path "$probe_dir/absent.log" \
              --require-secret-env-var GRAPHINSIGHT_CI_REQUIRED_SECRET_PROBE 2>&1)"; code=$?
          if [ "$code" -eq 0 ] \
            && printf '%s' "$out" | grep -q 'findings=0' \
            && printf '%s' "$out" | grep -q 'result=pass'; then
            echo "PASS_EMPTY_OK clean_artifact_with_required_secret_exit0"
          else
            echo "::error::CASE3 expected exit 0 + findings=0 result=pass, got exit=$code"
            printf '%s\n' "$out"; rc=1
          fi

          rm -rf "$probe_dir"
          exit "$rc"

  backend-unified-guards:
    name: Backend unified boundary guards
    runs-on: ubuntu-latest
    env:
      RBAC_AUTHZ_MODE: go_db
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphinsight-ci
      ADMIN_DATABASE_URL: sqlite:///./admin.db
      GRAPHINSIGHT_INTERNAL_TOKEN: ci-internal-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend virtual environment
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Prepare unified runtime env fixture
        shell: bash
        run: |
          mkdir -p logs/dev
          cat > logs/dev/backend.env <<'EOF'
          RBAC_AUTHZ_MODE=go_db
          NEO4J_URI=bolt://127.0.0.1:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=graphinsight-ci
          ADMIN_DATABASE_URL=sqlite:///./admin.db
          GRAPHINSIGHT_INTERNAL_TOKEN=ci-internal-token
          EOF

      - name: Compile backend boundary modules
        run: |
          backend/.venv/bin/python -m py_compile \
            backend/main.py \
            backend/api/internal_access.py \
            backend/api/route_registry.py \
            backend/api/routes/doc_qa.py \
            backend/api/routes/doc_qa_internal.py \
            backend/api/routes/nl2cypher.py \
            backend/api/routes/nl2cypher_internal.py \
            backend/admin/api/route_registry.py \
            backend/admin/api/endpoints/auth.py \
            backend/admin/api/endpoints/config.py \
            backend/admin/api/endpoints/jobs.py \
            backend/admin/api/endpoints/logs.py \
            backend/admin/api/endpoints/monitor.py \
            backend/admin/api/endpoints/profile.py \
            backend/admin/api/endpoints/qa_traces.py \
            backend/admin/api/endpoints/rbac.py \
            backend/admin/api/endpoints/users.py \
            backend/services/job_runtime.py \
            backend/services/qa_trace_runtime.py \
            backend/services/runtime_config.py \
            backend/services/runtime_db.py \
            backend/admin/services/job_service.py

      - name: Run unified boundary guard suite
        shell: bash
        run: |
          backend/.venv/bin/python backend/tests/run_unified_boundary_guards.py

  backend-release-smoke:
    name: Backend release smoke suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backend_release_smoke }}
    env:
      ADMIN_BASE_URL: ${{ secrets.GRAPHINSIGHT_E2E_API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_TOKEN }}
      BACKEND_RELEASE_SMOKE_INCLUDE: ${{ inputs.backend_release_smoke_include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend virtual environment
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Validate backend release smoke configuration
        shell: bash
        run: |
          if [[ -z "$ADMIN_BASE_URL" ]]; then
            echo "GRAPHINSIGHT_E2E_API_BASE_URL is required for backend release smoke."
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" && -z "$ADMIN_PASSWORD" ]]; then
            echo "GRAPHINSIGHT_E2E_ADMIN_TOKEN or GRAPHINSIGHT_E2E_ADMIN_PASSWORD is required for backend release smoke."
            exit 1
          fi

      - name: Run backend release smoke suite
        shell: bash
        run: |
          cmd=(backend/tests/run_release_acceptance.sh --skip-frontend-e2e --skip-perf-probe)
          if [[ -n "$BACKEND_RELEASE_SMOKE_INCLUDE" ]]; then
            IFS=',' read -ra cases <<< "$BACKEND_RELEASE_SMOKE_INCLUDE"
            for case_name in "${cases[@]}"; do
              case_name="$(echo "$case_name" | xargs)"
              if [[ -n "$case_name" ]]; then
                cmd+=(--include "$case_name")
              fi
            done
          fi
          "${cmd[@]}"

  release-frontend-e2e:
    name: Release frontend DocQA E2E
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_frontend_e2e }}
    env:
      ADMIN_BASE_URL: ${{ secrets.GRAPHINSIGHT_E2E_API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_TOKEN }}
      E2E_SPEC: ${{ inputs.frontend_e2e_spec }}
      E2E_CHECK_UI_LOGIN: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend virtual environment
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Validate release frontend E2E configuration
        shell: bash
        run: |
          if [[ -z "$ADMIN_BASE_URL" ]]; then
            echo "GRAPHINSIGHT_E2E_API_BASE_URL is required for release frontend E2E."
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" && -z "$ADMIN_PASSWORD" ]]; then
            echo "GRAPHINSIGHT_E2E_ADMIN_TOKEN or GRAPHINSIGHT_E2E_ADMIN_PASSWORD is required for release frontend E2E."
            exit 1
          fi

      - name: Run release frontend E2E via acceptance entry
        shell: bash
        run: |
          backend/tests/run_release_acceptance.sh \
            --skip-boundary-guards \
            --skip-backend-smoke \
            --skip-perf-probe

      - name: Scrub credential-bearing Playwright artifacts
        if: always()
        shell: bash
        run: |
          removed=0
          while IFS= read -r file; do
            rm -f "$file"
            removed=$((removed + 1))
          done < <(find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null || true)
          echo "TRACE_VIDEO_SCRUBBED removed=$removed"
          find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null | wc -l | sed 's/^/residual=/'

      - name: Scan upload paths for credential material
        if: always()
        id: secret_scan
        shell: bash
        run: |
          # 可选凭据：登录走 ADMIN_TOKEN 或 ADMIN_PASSWORD 二选一，单个变量合法可空，
          # 故用 --secret-env-var（未设打 NOTE）而非受保护的 --require-secret-env-var。
          # 上传的 playwright-report / test-results 属打包产物，赋值形状默认排除，
          # 仍扫注入凭据字面值与 jwt/dsn/bcrypt 高置信形状。
          if python3 backend/tests/check_artifact_secrets.py \
            --path frontend/playwright-report \
            --path frontend/test-results \
            --secret-env-var ADMIN_PASSWORD \
            --secret-env-var ADMIN_TOKEN; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::credential material found in upload paths; artifacts are withheld"
            exit 1
          fi

      - name: Upload Playwright report
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-e2e-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  release-acceptance:
    name: Full release acceptance (self-contained stack)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_acceptance }}
    env:
      # Performance thresholds are declared here, before the probe runs, and are
      # never back-derived from the measured results. max_p95_ms is selected per
      # regime by the "Declare performance thresholds" step below.
      PERF_PROBE_MAX_ERROR_RATE: '0.0'
      # Ephemeral single-use stack: local compose credentials only, no shared secret.
      ADMIN_DATABASE_URL: postgresql://graphinsight:graphinsight-dev-password@127.0.0.1:5434/graphinsight_admin
      ADMIN_BASE_URL: http://127.0.0.1:8081
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL || 'e2e-admin@local.test' }}
      E2E_SPEC: ${{ inputs.frontend_e2e_spec }}
      E2E_CHECK_UI_LOGIN: '1'
      PERF_PROBE_PRESET: ${{ inputs.perf_probe_preset }}
      PERF_PROBE_REQUESTS: ${{ inputs.perf_probe_requests }}
      PERF_PROBE_CONCURRENCY: ${{ inputs.perf_probe_concurrency }}
      RELEASE_ACCEPTANCE_ARTIFACTS_DIR: artifacts/release-acceptance
      LLM_ENABLED: ${{ secrets.GRAPHINSIGHT_E2E_LLM_API_KEY != '' && '1' || '0' }}
      LLM_API_KEY: ${{ secrets.GRAPHINSIGHT_E2E_LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.GRAPHINSIGHT_E2E_LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.GRAPHINSIGHT_E2E_LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision single-use stack credentials
        shell: bash
        run: |
          # Values are masked so they cannot surface in any later log line, and are
          # never written to a file that gets uploaded as an artifact.
          run_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          run_password="$(python3 -c 'import secrets; print("Ci" + secrets.token_urlsafe(16) + "a1")')"
          echo "::add-mask::$run_secret"
          echo "::add-mask::$run_password"
          {
            echo "ADMIN_SECRET_KEY=$run_secret"
            echo "ADMIN_PASSWORD=$run_password"
          } >> "$GITHUB_ENV"
          echo "credentials_provisioned=1 password_length_bytes=${#run_password}"

      - name: Declare performance thresholds for this regime
        shell: bash
        run: |
          # Fixed before the probe runs, never derived from its results.
          # Basis for the no-LLM SLO: local warm measurements of the four read cases
          # (health p95 27.6ms, query 26.3ms, docqa-health 332.5ms, nl2cypher-status
          # 29.1ms at 20 requests / concurrency 4) with a 9x allowance for a cold,
          # shared CI runner. With an LLM configured the docqa case is generation
          # bound, so the pre-declared SLO for that regime is 20000ms.
          if [[ "$LLM_ENABLED" == "1" ]]; then
            echo "PERF_PROBE_MAX_P95_MS=20000" >> "$GITHUB_ENV"
            echo "PERF_THRESHOLD_DECLARED max_error_rate=0.0 max_p95_ms=20000 regime=llm_configured"
          else
            echo "PERF_PROBE_MAX_P95_MS=3000" >> "$GITHUB_ENV"
            echo "PERF_THRESHOLD_DECLARED max_error_rate=0.0 max_p95_ms=3000 regime=llm_disabled"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend virtual environment
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Go gateway binary
        working-directory: go-backend
        run: go build -o "$RUNNER_TEMP/graphinsight-api" ./cmd/api

      - name: Bring up unified stack
        shell: bash
        run: |
          scripts/dev-backend.sh up
          # 只回显 *_BASE_URL，不再 cat 整个文件：runtime.env 一旦混入口令或带口令的 DSN，
          # 明文 cat 会直接进 Actions 日志。"该文件只允许承载 *_BASE_URL"由
          # check_dev_runtime_defaults.py 断言，扫描门禁再兜一遍上传路径。
          echo "--- runtime.env (base urls only) ---"
          grep -E '^[A-Z_]+_BASE_URL=' logs/dev/runtime.env || echo "no_base_url_keys"

      - name: Initialize fresh admin database
        shell: bash
        run: |
          backend/.venv/bin/python backend/init_pg_database.py
          backend/.venv/bin/python backend/admin/migrate_rbac_core.py --action migrate

      - name: Wait for gateway dependencies
        shell: bash
        run: |
          ready() {
            curl -fsS --max-time 5 "$ADMIN_BASE_URL/health" | python3 -c 'import json,sys; d=(json.load(sys.stdin).get("data") or {}); sys.exit(0 if all(bool((d.get(k) or {}).get("connected")) for k in ("neo4j","python_backend","orchestrator")) else 1)'
          }
          for attempt in $(seq 1 120); do
            if ready; then
              echo "GATEWAY_READY attempt=$attempt"
              curl -fsS --max-time 5 "$ADMIN_BASE_URL/health" | python3 -c 'import json,sys; d=(json.load(sys.stdin).get("data") or {}); print("dependencies:", {k: bool((d.get(k) or {}).get("connected")) for k in ("neo4j","python_backend","orchestrator")})'
              exit 0
            fi
            sleep 2
          done
          echo "GATEWAY_NOT_READY url=$ADMIN_BASE_URL"
          tail -n 80 logs/dev/go.log || true
          tail -n 80 logs/dev/python.log || true
          exit 1

      - name: Seed E2E account and knowledge base
        shell: bash
        run: |
          export SEED_ADMIN_EMAIL="$ADMIN_EMAIL"
          export SEED_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          export SEED_VERIFY_BASE_URL="$ADMIN_BASE_URL"
          backend/.venv/bin/python backend/scripts/seed_e2e_local_stack.py

      - name: Run full release acceptance
        shell: bash
        run: |
          mkdir -p "$RELEASE_ACCEPTANCE_ARTIFACTS_DIR"
          # No --fail-fast: the whole matrix must report, so the summary lists every
          # failing step instead of stopping at the first one.
          backend/tests/run_release_acceptance.sh 2>&1 | tee "$RELEASE_ACCEPTANCE_ARTIFACTS_DIR/acceptance-summary.log"

      - name: Scrub credential-bearing Playwright artifacts
        if: always()
        shell: bash
        run: |
          # playwright.config.ts 在 CI 里已不生成 trace/video，这里仍兜底删一遍：
          # HTML reporter 会把 trace/video 复制进 frontend/playwright-report/data，
          # 只清 test-results 原件会让报告自带可回放的 Authorization 头。
          removed=0
          while IFS= read -r file; do
            rm -f "$file"
            removed=$((removed + 1))
          done < <(find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null || true)
          echo "TRACE_VIDEO_SCRUBBED removed=$removed"
          find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null | wc -l | sed 's/^/residual=/'

      - name: Scan upload paths for credential material
        if: always()
        id: secret_scan
        shell: bash
        run: |
          # 上传路径必须过一次扫描：命中本次运行注入的凭据字面值或凭据形状就不发布产物。
          # 分层口径（任务 #207）：
          #   * ADMIN_PASSWORD / ADMIN_SECRET_KEY 由上面的 "Provision single-use stack
          #     credentials" 步骤每次运行必定写入，属受保护凭据——用 --require-secret-env-var，
          #     万一 provision 静默失败也必须 fail-closed，而不是扫 0 字面量后假绿；
          #   * LLM_API_KEY 仅在 LLM_ENABLED=1 时非空，属可选凭据，用 --secret-env-var
          #     （未设只打 NOTE，与关闭 LLM 的合法态一致）；
          #   * 本 job 的 env 里根本没有 ADMIN_TOKEN（用的是随机口令），旧写法把它列为
          #     扫描目标只是制造"已检查 admin token"的假象，故删除。
          # 赋值形状策略：playwright-report/ 与 minified 打包产物由扫描器默认排除赋值形状，
          # 仍扫字面值与 jwt/dsn/bcrypt 高置信形状（策略由 check_artifact_secrets_selftest.py 断言）。
          if backend/.venv/bin/python backend/tests/check_artifact_secrets.py \
            --path "$RELEASE_ACCEPTANCE_ARTIFACTS_DIR" \
            --path logs/dev/python.log \
            --path logs/dev/go.log \
            --path frontend/playwright-report \
            --require-secret-env-var ADMIN_PASSWORD \
            --require-secret-env-var ADMIN_SECRET_KEY \
            --secret-env-var LLM_API_KEY \
            --allow-fixture graphinsight-dev-password \
            --allow-fixture change-this-password \
            --allow-fixture ci-internal-token; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::credential material found in upload paths; artifacts are withheld"
            exit 1
          fi

      - name: Upload release acceptance artifacts
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-artifacts
          path: |
            artifacts/release-acceptance
            frontend/playwright-report
            logs/dev/python.log
            logs/dev/go.log
          if-no-files-found: ignore

  rollback-matrix:
    name: Rollback acceptance matrix (enforce + soft)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 回滚验收必须能重复执行，且必须两条授权腿都跑：只看 enforce 会把可回滚下限判高
    # （45db134 在 enforce 下 15/15 全过，在 soft 下伪造入站身份头返回 200）。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rollback_matrix }}
    env:
      ADMIN_DATABASE_URL: postgresql://graphinsight:graphinsight-dev-password@127.0.0.1:5434/graphinsight_admin
      ADMIN_BASE_URL: http://127.0.0.1:8081
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL || 'e2e-admin@local.test' }}
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: change-this-password
      PYTHON_BACKEND_BASE_URL: http://127.0.0.1:8001
      DRILL_PORT_BASE: '18091'
      ROLLBACK_MATRIX_ARTIFACTS_DIR: artifacts/rollback-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 候选版本要能 git archive 出旧提交，浅克隆会让身份链构建直接失败。
          fetch-depth: 0

      - name: Provision single-use stack credentials
        shell: bash
        run: |
          run_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          run_password="$(python3 -c 'import secrets; print("Ci" + secrets.token_urlsafe(16) + "a1")')"
          echo "::add-mask::$run_secret"
          echo "::add-mask::$run_password"
          {
            echo "ADMIN_SECRET_KEY=$run_secret"
            echo "ADMIN_PASSWORD=$run_password"
          } >> "$GITHUB_ENV"
          echo "credentials_provisioned=1 password_length_bytes=${#run_password}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend virtual environment
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Bring up unified stack
        shell: bash
        run: |
          scripts/dev-backend.sh up
          echo "--- runtime.env (base urls only) ---"
          grep -E '^[A-Z_]+_BASE_URL=' logs/dev/runtime.env || echo "no_base_url_keys"

      - name: Initialize fresh admin database
        shell: bash
        run: |
          backend/.venv/bin/python backend/init_pg_database.py
          backend/.venv/bin/python backend/admin/migrate_rbac_core.py --action migrate

      - name: Wait for gateway dependencies
        shell: bash
        run: |
          ready() {
            curl -fsS --max-time 5 "$ADMIN_BASE_URL/health" | python3 -c 'import json,sys; d=(json.load(sys.stdin).get("data") or {}); sys.exit(0 if all(bool((d.get(k) or {}).get("connected")) for k in ("neo4j","python_backend","orchestrator")) else 1)'
          }
          for attempt in $(seq 1 120); do
            if ready; then
              echo "GATEWAY_READY attempt=$attempt"
              exit 0
            fi
            sleep 2
          done
          echo "GATEWAY_NOT_READY url=$ADMIN_BASE_URL"
          tail -n 80 logs/dev/go.log || true
          exit 1

      - name: Build rollback candidate binaries
        shell: bash
        env:
          ROLLBACK_MATRIX_VERSIONS: ${{ inputs.rollback_matrix_versions }}
        run: |
          IFS=',' read -r -a versions <<< "$ROLLBACK_MATRIX_VERSIONS"
          for version in "${versions[@]}"; do
            version="$(echo "$version" | xargs)"
            sha="$(git rev-parse "$version")"
            build_dir="$RUNNER_TEMP/drill-build/$version/go-backend"
            rm -rf "$RUNNER_TEMP/drill-build/$version"
            mkdir -p "$build_dir"
            git archive "$sha" go-backend | tar -x -C "$RUNNER_TEMP/drill-build/$version"
            (cd "$build_dir" && CGO_ENABLED=0 go build -trimpath -o bin/api ./cmd/api)
            # subshell 的 cd 不持久，sha256sum 必须在构建目录内跑，否则证据里是空哈希。
            (cd "$build_dir" && echo "CANDIDATE_BUILT version=$version sha=$sha sha256=$(sha256sum bin/api | cut -c1-64)")
          done

      - name: Seed E2E account and knowledge base
        shell: bash
        run: |
          # 夹具阶段要用真实登录取 token，而本 job 的口令是每次运行现生成的随机值，
          # 没有这一步就没有对应账号，run #23 就是这样在 setup 腿报 401 INVALID_CREDENTIALS 的。
          export SEED_ADMIN_EMAIL="$ADMIN_EMAIL"
          export SEED_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          export SEED_VERIFY_BASE_URL="$ADMIN_BASE_URL"
          backend/.venv/bin/python backend/scripts/seed_e2e_local_stack.py

      - name: Establish drill fixtures on the release version
        shell: bash
        run: |
          # 夹具只能在发布版本 + enforce 腿上建立一次，避免把新 kb / 新用户写进旧版本。
          # state 文件必须落在仓库外，由探针自身强制（DRILL_PREREQ_INVALID）。
          backend/.venv/bin/python backend/tests/run_rollback_drill.py \
            --phase setup \
            --base-url "$ADMIN_BASE_URL" \
            --version-label HEAD \
            --state-file "$RUNNER_TEMP/gi_drill_state.json" \
            --admin-email "$ADMIN_EMAIL"
          stat -c 'STATE_FILE_MODE mode=%a %n' "$RUNNER_TEMP/gi_drill_state.json"

      - name: Run enforce + soft rollback matrix
        shell: bash
        # The `runner` context is only legal in step-level env, not in the job-level
        # env block, so the drill roots are declared here.
        env:
          DRILL_BUILD_ROOT: ${{ runner.temp }}/drill-build
          DRILL_PID_DIR: ${{ runner.temp }}/drill-pid
          ROLLBACK_MATRIX_VERSIONS: ${{ inputs.rollback_matrix_versions }}
        run: |
          mkdir -p "$ROLLBACK_MATRIX_ARTIFACTS_DIR"
          # The {…} tokens are placeholders the runner script substitutes later, so
          # they must stay single-quoted here.
          # shellcheck disable=SC2016
          backend/tests/run_rollback_matrix.sh \
            --versions "$ROLLBACK_MATRIX_VERSIONS" \
            --modes "enforce,soft" \
            --python "backend/.venv/bin/python" \
            --port-base "$DRILL_PORT_BASE" \
            --base-url 'http://127.0.0.1:{port}' \
            --state-file "$RUNNER_TEMP/gi_drill_state.json" \
            --admin-email "$ADMIN_EMAIL" \
            --log-dir "$ROLLBACK_MATRIX_ARTIFACTS_DIR/logs" \
            --start-cmd 'bash backend/tests/run_rollback_leg.sh start {version} {mode} {port} {gw_log} {authz_env}' \
            --stop-cmd 'bash backend/tests/run_rollback_leg.sh stop {version} {mode}' \
            --identity-cmd 'git rev-parse {version} && sha256sum "${DRILL_BUILD_ROOT}"/{version}/go-backend/bin/api' \
            2>&1 | tee "$ROLLBACK_MATRIX_ARTIFACTS_DIR/matrix-summary.log"

      - name: Verify leg cleanup
        if: always()
        shell: bash
        run: |
          # 两个坑：pgrep 无命中返回 1，会被步骤默认的 `bash -e` 当成失败（而那恰好是"零残留"
          # 的健康态）；同时包装 shell 的命令行里带着这个字面量，pgrep -f 会把它自己数进去。
          # 用字符类打断字面量自匹配，并用 || true 收掉无命中的退出码。
          residual="$(pgrep -f '[d]rill-build/.*/bin/api' | grep -c . || true)"
          state_files="$(find . -name '*drill_state*.json' -not -path './backend/.venv/*' | grep -c . || true)"
          echo "LEG_CLEANUP_RESIDUAL processes=$residual"
          echo "REPO_STATE_RESIDUAL files=$state_files"
          [[ "$residual" == "0" ]] || { echo "::error::rollback legs still running after the matrix"; exit 1; }

      - name: Scan upload paths for credential material
        if: always()
        id: matrix_secret_scan
        shell: bash
        run: |
          # ADMIN_PASSWORD / ADMIN_SECRET_KEY 由本 job 的 provision 步骤必定写入 → 受保护，
          # 未设即 fail-closed。本 job env 里没有 ADMIN_TOKEN（旧写法是虚假声明，删除）。
          if backend/.venv/bin/python backend/tests/check_artifact_secrets.py \
            --path "$ROLLBACK_MATRIX_ARTIFACTS_DIR" \
            --path logs/dev/go.log \
            --require-secret-env-var ADMIN_PASSWORD \
            --require-secret-env-var ADMIN_SECRET_KEY \
            --allow-fixture graphinsight-dev-password \
            --allow-fixture change-this-password \
            --allow-fixture ci-internal-token; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::credential material found in rollback matrix artifacts; artifacts are withheld"
            exit 1
          fi

      - name: Upload rollback matrix artifacts
        if: always() && steps.matrix_secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rollback-matrix-artifacts
          path: |
            artifacts/rollback-matrix
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend DocQA E2E
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_frontend_e2e }}
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ secrets.GRAPHINSIGHT_E2E_API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_TOKEN }}
      E2E_CHECK_UI_LOGIN: '0'
      FRONTEND_E2E_SPEC: ${{ inputs.frontend_e2e_spec }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium-headless-shell
        working-directory: frontend

      - name: Validate E2E configuration
        shell: bash
        run: |
          if [[ -z "$VITE_API_BASE_URL" ]]; then
            echo "GRAPHINSIGHT_E2E_API_BASE_URL is required for frontend E2E."
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" && -z "$ADMIN_PASSWORD" ]]; then
            echo "GRAPHINSIGHT_E2E_ADMIN_TOKEN or GRAPHINSIGHT_E2E_ADMIN_PASSWORD is required for frontend E2E."
            exit 1
          fi

      - name: Run frontend E2E
        shell: bash
        run: |
          if [[ -n "$FRONTEND_E2E_SPEC" ]]; then
            node node_modules/@playwright/test/cli.js test "$FRONTEND_E2E_SPEC"
          else
            node node_modules/@playwright/test/cli.js test
          fi

      - name: Scrub credential-bearing Playwright artifacts
        if: always()
        shell: bash
        run: |
          removed=0
          while IFS= read -r file; do
            rm -f "$file"
            removed=$((removed + 1))
          done < <(find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null || true)
          echo "TRACE_VIDEO_SCRUBBED removed=$removed"
          find frontend/test-results frontend/playwright-report -type f \( -name 'trace.zip' -o -name '*.webm' \) 2>/dev/null | wc -l | sed 's/^/residual=/'

      - name: Scan upload paths for credential material
        if: always()
        id: secret_scan
        shell: bash
        run: |
          # 可选凭据：登录走 ADMIN_TOKEN 或 ADMIN_PASSWORD 二选一，单个变量合法可空，
          # 故用 --secret-env-var（未设打 NOTE）而非受保护的 --require-secret-env-var。
          # 上传的 playwright-report / test-results 属打包产物，赋值形状默认排除，
          # 仍扫注入凭据字面值与 jwt/dsn/bcrypt 高置信形状。
          if python3 backend/tests/check_artifact_secrets.py \
            --path frontend/playwright-report \
            --path frontend/test-results \
            --secret-env-var ADMIN_PASSWORD \
            --secret-env-var ADMIN_TOKEN; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::credential material found in upload paths; artifacts are withheld"
            exit 1
          fi

      - name: Upload Playwright report
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  perf-probe:
    name: Performance probe
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_perf_probe }}
    env:
      GO_BASE_URL: ${{ secrets.GRAPHINSIGHT_E2E_API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.GRAPHINSIGHT_E2E_ADMIN_TOKEN }}
      PERF_PROBE_PRESET: ${{ inputs.perf_probe_preset }}
      PERF_PROBE_REQUESTS: ${{ inputs.perf_probe_requests }}
      PERF_PROBE_CONCURRENCY: ${{ inputs.perf_probe_concurrency }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate performance probe configuration
        shell: bash
